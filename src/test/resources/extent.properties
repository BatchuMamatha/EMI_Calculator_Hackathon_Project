# =====================================================================
# Extent Spark report configuration consumed by ExtentManager.
# Location: src/test/resources/extent.properties
# =====================================================================

# When true, each run produces a fresh file with a timestamp suffix so
# previous reports are NOT overwritten.
extent.report.timestamp        = true

# Base path (file extension .html is appended automatically; the timestamp
# is inserted just before the extension when extent.report.timestamp=true).
# Produced filename example: reports/extent/ExtentReport_2026.05.22_11.59.34.html
extent.report.path             = reports/extent/ExtentReport

# Look and feel
extent.report.theme            = DARK
extent.report.document.title   = EMI Calculator Automation Report
extent.report.report.name      = EMI Calculator - INTQEA26QE003 Hackathon

# Timestamp format: yyyy.MM.dd_HH.mm.ss
# Dots instead of colons because Windows file names cannot contain ':'.
extent.report.timestamp.format = yyyy.MM.dd_HH.mm.ss
