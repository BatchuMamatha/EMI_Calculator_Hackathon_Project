# It used to configure tech.grasshopper:extentreports-cucumber7-adapter,
# which has a known thread-safety bug (GherkinDialect / Gson LinkedTreeMap
# concurrency) that throws java.lang.AssertionError when scenarios start
# on parallel threads.
#
# We now drive ExtentReports directly via
# src/main/java/com/emicalc/automation/reports/ExtentManager.java
# which is thread-safe. All Spark reporter configuration (theme, document
# title, report name) lives in that class.
#
# Generated report path: reports/extent/SparkReport.html
