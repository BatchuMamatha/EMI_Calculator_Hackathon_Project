# =====================================================================
# Extent configuration — read by BOTH:
#   1) ExtentManager (our thread-safe wrapper, drives reports/extent/ExtentReport_<ts>.html)
#   2) ExtentCucumberAdapter (the Cucumber plugin listed in TestRunner)
# Location: src/test/resources/extent.properties
# =====================================================================

# --- ExtentCucumberAdapter (Spark) settings --------------------------
extent.reporter.spark.start     = true
extent.reporter.spark.out       = reports/extent/AdapterSparkReport.html
extent.reporter.spark.config    = src/test/resources/extent-config.xml
screenshot.dir                  = screenshots/
screenshot.rel.path             = ../../screenshots/
extent.reporter.spark.base64imagesrc = true

# --- ExtentManager (custom) settings ---------------------------------

# When true, each run produces a fresh file with a timestamp suffix so
# previous reports are not overwritten (e.g. SparkReport_20260520_153012.html).
extent.report.timestamp        = true

# Base path (file extension .html is appended automatically; the timestamp
# is inserted just before the extension when extent.report.timestamp=true).
# Produced filename example: reports/extent/ExtentReport_20260520_153012.html
extent.report.path             = reports/extent/ExtentReport

# Look and feel
extent.report.theme            = DARK
extent.report.document.title   = EMI Calculator Automation Report
extent.report.report.name      = EMI Calculator - INTQEA26QE003 Hackathon
extent.report.timestamp.format = yyyyMMdd_HHmmss
